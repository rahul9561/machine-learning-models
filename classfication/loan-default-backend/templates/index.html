<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Default Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, select { padding: 5px; margin: 5px; width: 200px; }
        button { padding: 10px 20px; }
        .result { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>

    <h1>Loan Default Prediction</h1>

    <form id="loanForm">
        <input type="number" name="ApplicantIncome" placeholder="Applicant Income" required><br>
        <input type="number" name="CoapplicantIncome" placeholder="Coapplicant Income" required><br>
        <input type="number" name="LoanAmount" placeholder="Loan Amount" required><br>
        <input type="number" name="Loan_Amount_Term" placeholder="Loan Amount Term" required><br>
        <select name="Credit_History" required>
            <option value="">Credit History</option>
            <option value="1">Good (1)</option>
            <option value="0">Bad (0)</option>
        </select><br>
        <select name="Gender" required>
            <option value="">Gender</option>
            <option value="1">Male</option>
            <option value="0">Female</option>
        </select><br>
        <select name="Married" required>
            <option value="">Married</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>
        <select name="Education" required>
            <option value="">Education</option>
            <option value="1">Graduate</option>
            <option value="0">Not Graduate</option>
        </select><br>
        <select name="Self_Employed" required>
            <option value="">Self Employed</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>
        <select name="Property_Area" required>
            <option value="">Property Area</option>
            <option value="0">Rural</option>
            <option value="1">Semiurban</option>
            <option value="2">Urban</option>
        </select><br>

        <button type="submit">Predict</button>
    </form>

    <div class="result" id="result"></div>

    <script>
        document.getElementById('loanForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => data[key] = Number(value));

            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById('result').innerText = 
                result.prediction === 1 ? 'Loan Approved ✅' : 'Loan Default Risk ❌';
        });
    </script>

</body>
</html>
